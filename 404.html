<!DOCTYPE html>
<html lang="en">

<head>
<!-- kermit:portable-root - the site can be served from the domain root, a
     sub-path (GitHub Pages project sites) or a CDN path (jsDelivr), so no page
     hard-codes where it lives: internal links stay relative to the site root
     and this <base> pins that root for every page depth. -->
<base href="./">
<script>
    (function () {
        // Inside science.html / science.svg this document is a srcdoc frame: the
        // wrapper may hand over a site root for hosts that cannot serve the site
        // tree next to the file (built with --base). Everything else is already
        // handled by the <base> above.
        var override = null;
        try {
            override = window.frameElement && window.frameElement.getAttribute("data-base");
        } catch (e) { }

        if (override) {
            var base = document.querySelector("base");
            if (base) {
                try { base.href = new URL(override, document.baseURI).href; }
                catch (e) { base.href = override; }
            }
        }

        // Resolve a site path against the base, for the calls that must not rely
        // on <base> (location assignments, and anything cross-document).
        window.kermitUrl = function (path) {
            try { return new URL(path, document.baseURI).href; }
            catch (e) { return path; }
        };

        // A bare "#" would otherwise resolve to the base (the site root) and
        // navigate away. The click handlers on these links still run.
        document.addEventListener("click", function (e) {
            var el = e.target;
            while (el && el !== document) {
                if (el.tagName === "A" && el.getAttribute && el.getAttribute("href") === "#") {
                    e.preventDefault();
                    return;
                }
                el = el.parentNode;
            }
        }, true);
    })();
</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <link rel="icon" type="image/png" href="assets/img/fav.png">

    <link rel="stylesheet" href="assets/css/colors.css" id="css-theme-link">

</head>

<body>
    

    <div id="homeContent">
        <h1 class="text-8xl text-[var(--bright-text)] font-bold">404</h1>
        <p class="text-[var(--text)]">not found.</p>
        <br>
        <a href="./" class="text-[var(--text)] opacity-50 underline underline-offset-3 hover:opacity-100 transition-all">back home</a>
    </div>

    

    <div class="toast-container fixed right-4 top-4 w-1/4">
    </div>

    <p class="fixed left-1/2 bottom-2 translate-x-[-50%] text-sm text-white/25"><i><i class="fas fa-lightbulb"></i>&nbsp;&nbsp;this page might be in the works!</i></p>

    <!-- DEV TOAST BUTTONS
    <div class="fixed flex justify-center left-1/2 bottom-5 translate-x-[-50%] h-fit w-1/2">
        <button class="w-fit m-1 h-fit p-4 text-white font-bold rounded-full bg-slate-900 border border-white/10" onclick="toast('success', 'Successful toast')">Success Toast</button>
        <button class="w-fit m-1 h-fit p-4 text-white font-bold rounded-full bg-slate-900 border border-white/10"
            onclick="toast('info', 'Info toast')">Info Toast</button>
        <button class="w-fit m-1 h-fit p-4 text-white font-bold rounded-full bg-slate-900 border border-white/10"
            onclick="toast('error', 'Error toast')">Error Toast</button>
        <button class="w-fit m-1 h-fit p-4 text-white font-bold rounded-full bg-slate-900 border border-white/10"
            onclick="toast('warn', 'Warning toast')">Warning Toast</button>
    </div> 
    -->

    <iframe id="contentFrame"></iframe>

    <script>
        // The proxy used to be a pair of Service Workers (Scramjet/Ultraviolet). It
        // is one page now (/proxy.html: the GUST engine over a Wisp WebSocket
        // tunnel), so a returning visitor's old workers are unregistered here
        // rather than registered - a stale one would intercept this page's routes.
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then((regs) => {
                regs.forEach((reg) => {
                    const worker = reg.active || reg.waiting || reg.installing;
                    const path = worker && worker.scriptURL ? new URL(worker.scriptURL, location.href).pathname : "";
                    if (/^\/(?:sw\.js|uv\/sw\.js)$/.test(path)) reg.unregister();
                });
            }).catch(() => { });
        }

        window.addEventListener("load", () => {
            lucide.createIcons();
        });

        const contentFrame = document.getElementById('contentFrame');
        const homeContent = document.getElementById('homeContent');
        const navLinks = document.querySelectorAll('nav a[data-page]');

        function navTo(l) {
            if (l === "home") {
                contentFrame.style.display = "none"
                homeContent.style.display = "block"
            } else {
                homeContent.style.display = "none"
                contentFrame.style.display = "block"
                contentFrame.src = `pages/${l}.html`
            }
        }

        const homesearch = document.getElementById("homesearch");

        function rSearch(input) {
            let url = input;
            if (!url.includes(".") || url.includes(" ")) {
                url = "https://search.brave.com/search?q=" + url;
            } else {
                if (!url.startsWith("http://") && !url.startsWith("https://")) {
                    url = "https://" + url;
                }
            }

            homeContent.classList.add('hidden');
            contentFrame.classList.add('active');
            contentFrame.src = "pages/embed.html?launch=" + encodeURIComponent(url);
            location.href = "#?launch=" + encodeURIComponent(url)
        }

        homesearch?.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                rSearch(homesearch?.value.trim());
            }
        });

        document.addEventListener("keydown", (e) => {
            if (!contentFrame.classList.contains('active')) {
                homesearch?.focus();
            }
        });

        function toast(icon, msg) {
            const container = document.querySelector(".toast-container")
            const newToast = document.createElement("div")
            const newToastIcon = document.createElement("i")
            newToastIcon.classList.add("toast-icon", "lucide", "far", "fa-icon-lol")
            const newToastMsg = document.createElement("span")
            newToastMsg.classList.add("toast-msg")
            newToast.classList.add("toast", "bg-slate-900", "transition-all", "relative", "duration-300", "shadow-black/30", "shadow-lg", "p-4", "h-fit", "w-1/1", "flex", "rounded-full", "m-3", "border", "border-white/10")
            newToast.style.right = "-120%"
            container.appendChild(newToast)
            newToast.appendChild(newToastIcon)
            newToast.appendChild(newToastMsg)

            switch (icon) {
                case "success":
                    if (newToastIcon && newToastMsg) {
                        newToastIcon.classList.add("fa-circle-check")
                        newToastMsg.textContent = msg
                    }
                    break
                case "info":
                    newToastIcon.classList.add("fa-circle-info")
                    newToastMsg.textContent = msg
                    break;
                case "error":
                    newToastIcon.classList.add("fa-circle-x")
                    newToastMsg.textContent = msg
                case "warn":
                    newToastIcon.classList.add("fa-circle-exclamation")
                    newToastMsg.textContent = msg
            }

            setTimeout(() => {
                newToast.style.right = "4%"
            }, 25)

            setTimeout(() => {
                newToast.style.right = "-120%"
            }, 4000)

            setTimeout(() => {
                newToast.remove()
            }, 4325)
        }
    </script>
</body>

</html>
