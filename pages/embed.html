<!DOCTYPE html>
<html lang="en">

<head>
<!-- kermit:portable-root - the site can be served from the domain root, a
     sub-path (GitHub Pages project sites) or a CDN path (jsDelivr), so no page
     hard-codes where it lives: internal links stay relative to the site root
     and this <base> pins that root for every page depth. -->
<base href="../">
<script>
    (function () {
        // Inside science.html / science.svg this document is a srcdoc frame: the
        // wrapper may hand over a site root for hosts that cannot serve the site
        // tree next to the file (built with --base). Everything else is already
        // handled by the <base> above.
        var override = null;
        try {
            override = window.frameElement && window.frameElement.getAttribute("data-base");
        } catch (e) { }

        if (override) {
            var base = document.querySelector("base");
            if (base) {
                try { base.href = new URL(override, document.baseURI).href; }
                catch (e) { base.href = override; }
            }
        }

        // Resolve a site path against the base, for the calls that must not rely
        // on <base> (location assignments, and anything cross-document).
        window.kermitUrl = function (path) {
            try { return new URL(path, document.baseURI).href; }
            catch (e) { return path; }
        };

        // A bare "#" would otherwise resolve to the base (the site root) and
        // navigate away. The click handlers on these links still run.
        document.addEventListener("click", function (e) {
            var el = e.target;
            while (el && el !== document) {
                if (el.tagName === "A" && el.getAttribute && el.getAttribute("href") === "#") {
                    e.preventDefault();
                    return;
                }
                el = el.parentNode;
            }
        }, true);
    })();
</script>

    <script>
        // The proxy engine is one page now (/proxy.html: the vendored GUST build,
        // over a Wisp WebSocket tunnel), so there is no Service Worker to register
        // - but a visitor from the old Scramjet/Ultraviolet version still has one
        // installed, and it would intercept this page's own routes. Unregister it.
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then((regs) => {
                regs.forEach((reg) => {
                    const worker = reg.active || reg.waiting || reg.installing;
                    const path = worker && worker.scriptURL ? new URL(worker.scriptURL, location.href).pathname : "";
                    if (/^\/(?:sw\.js|uv\/sw\.js)$/.test(path)) reg.unregister();
                });
            }).catch(() => { });
        }
    </script>

        }

            left: 50%;

            margin-top: 35px;
            gap: 05px;

        .slides-buttons button {

            width: 40px;
            flex-shrink: 0;
            padding: 0;

            border-radius: 10px;

            cursor: pointer;
            background: var(--bg-2);

        .ri {
            font-size: 20px;

        .slides-buttons input {

        }

        .slides-buttons input:focus {

        }

        }

        .tab {

            color: var(--bright-text);

        .newtab {

            height: 40px;
            width: 40px;
            border-radius: 10px;
            transition: 0.2s;
            cursor: pointer;
            border: 1px solid var(--border-4);

            color: var(--bright-text);
        }

        .slides-loading {
            background: var(--bg-2);
            height: 3px;
            width: 200px;
            position: relative;
            transform: translate(-50%, -50%);
            left: 50%;
            top: 55%;
            border-radius: 100px;
        }

        .slides-loading::after {
            content: "";
            position: absolute;
            height: 100%;
            background: var(--accent);
            left: 0;
            border-radius: 100px;
            bottom: 0;
            width: 100%;
            animation: slides-loading-lol .75s infinite ease;
        }

        @keyframes slides-loading-lol {
            0% {
                transform-origin: left;
                transform: scaleX(0);
            }

            50% {
                transform-origin: left;
                transform: scaleX(1);
            }

            50.01% {
                transform-origin: right;
                transform: scaleX(1);
            }

            100% {
                transform-origin: right;
                transform: scaleX(0);
            }
        }

    <script defer>
        function rSearch(input) {
            newTab()

            let url = input;
            if (!url.includes(".") || url.includes(" ")) {
                url = "https://search.brave.com/search?q=" + url;
            } else {
                if (!url.startsWith("http://") && !url.startsWith("https://")) {
                    url = "https://" + url;
                }
            }

            const b = document.querySelector(".slides-container")
            const frames = document.querySelectorAll(".viewframe")

            b.style.opacity = 1
            b.style.pointerEvents = "all"

            frames.forEach(frame => {
                frame.style.opacity = 1
                frame.style.pointerEvents = "all"
            })

            console.log("rSearch")
            nav(url)
        }
        const homesearch = document.getElementById("searchbar");

        homesearch.addEventListener("keydown", (e) => {
            console.log("askjdfaskhjlgdf")
            if (e.key === "Enter") {
                rSearch(homesearch?.value.trim());
                console.log("rsearching")
            }
            console.log("check")
        });

        const params = new URLSearchParams(window.location.search)

        // The engine page brings up its own tunnel, so there is nothing to connect
        // here first: hand it the URL and GUST boots on its own.
        const launch = params.get("launch")
        if (launch) rSearch(launch)
    </script>
