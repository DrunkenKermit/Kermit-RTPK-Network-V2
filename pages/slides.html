<!-- kermit:portable-root - the site can be served from the domain root, a
     sub-path (GitHub Pages project sites) or a CDN path (jsDelivr), so no page
     hard-codes where it lives: internal links stay relative to the site root
     and this <base> pins that root for every page depth. -->
<base href="../">
<script>
    (function () {
        // Inside science.html / science.svg this document is a srcdoc frame: the
        // wrapper may hand over a site root for hosts that cannot serve the site
        // tree next to the file (built with --base). Everything else is already
        // handled by the <base> above.
        var override = null;
        try {
            override = window.frameElement && window.frameElement.getAttribute("data-base");
        } catch (e) { }

        if (override) {
            var base = document.querySelector("base");
            if (base) {
                try { base.href = new URL(override, document.baseURI).href; }
                catch (e) { base.href = override; }
            }
        }

        // Resolve a site path against the base, for the calls that must not rely
        // on <base> (location assignments, and anything cross-document).
        window.kermitUrl = function (path) {
            try { return new URL(path, document.baseURI).href; }
            catch (e) { return path; }
        };

        // A bare "#" would otherwise resolve to the base (the site root) and
        // navigate away. The click handlers on these links still run.
        document.addEventListener("click", function (e) {
            var el = e.target;
            while (el && el !== document) {
                if (el.tagName === "A" && el.getAttribute && el.getAttribute("href") === "#") {
                    e.preventDefault();
                    return;
                }
                el = el.parentNode;
            }
        }, true);
    })();
</script>

    <script>
        // The proxy engine is one page now (/proxy.html: the vendored GUST build,
        // over a Wisp WebSocket tunnel), so there is no Service Worker to register
        // - but a visitor from the old Scramjet/Ultraviolet version still has one
        // installed, and it would intercept this page's own routes. Unregister it.
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then((regs) => {
                regs.forEach((reg) => {
                    const worker = reg.active || reg.waiting || reg.installing;
                    const path = worker && worker.scriptURL ? new URL(worker.scriptURL, location.href).pathname : "";
                    if (/^\/(?:sw\.js|uv\/sw\.js)$/.test(path)) reg.unregister();
                });
            }).catch(() => { });
        }
    </script>

<body>

    <style>
        .slides-container {
            background: var(--bg);
            width: 100%;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 6;
            transition: 0.2s;
        }

        .slides-frame {
            /* The controls bar measures its own height (see layoutChrome in
               assets/js/slidesfunctions.js), so the page frame always starts
               below the real chrome and can never be covered by it. */
            --chrome: var(--slides-chrome-h, 104px);
            width: calc(100% - 20px);
            height: calc(100vh - var(--chrome) - 10px);
            position: fixed;
            top: var(--chrome);
            left: 50%;
            transform: translateX(-50%);
            border-radius: 12px;
            border: 1px solid var(--border-3);
            display: none;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
        }

        .slides-frame.active {
            display: block;
            opacity: 1;
            pointer-events: all;
        }

        /* One stacked chrome: the tab strip sits on top of a single full-width
           control row. The old layout absolutely positioned the control row 35px
           down and 95% wide, so it collided with the tabs and wasted the sides. */
        .slides-controls {
            position: fixed;
            width: 100%;
            left: 0;
            top: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 8px;
            /* Extra top padding keeps a comfortable gap between the browser
               tabs and the toolbar above them. */
            padding: 48px 12px 10px;
            background: color-mix(in srgb, var(--bg) 82%, transparent 18%);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-4);
            /* Never let the chrome grow to swallow the page on a short screen. */
            max-height: calc(100vh - 120px);
            overflow-y: auto;
            z-index: 1001;
        }

        .tabs {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 0px;
            padding-bottom: 2px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .slides-buttons {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .slides-buttons .hcontainer {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
            min-width: 0;
        }

        .slides-buttons button {
            height: 40px;
            width: 40px;
            flex-shrink: 0;
            padding: 0;
            font-size: 16px;
            border-radius: 10px;
            transition: 0.2s;
            cursor: pointer;
            background: var(--bg-2);
            border: 1px solid var(--border-4);
            color: var(--bright-text);
        }

        .slides-buttons button:hover {
            background: var(--bg-3);
            color: var(--bright-text);
        }

        .ri {
            font-size: 20px;
        }

        .slides-buttons input {
            background: var(--bg-3);
            border: 1px solid var(--border-4);
            border-radius: 10px;
            height: 40px;
            padding: 0 20px;
            flex: 1;
            transition: 0.2s;
            color: var(--bright-text);
            font-family: Inter;
            outline: none;
            font-size: 14px;
        }

        .slides-buttons input:focus {
            outline: none;
            border: 1px solid var(--accent);
        }

        .slides-buttons input::placeholder {
            color: var(--text);
        }

        .tab {
            background: var(--bg-2);
            max-width: 200px;
            min-width: 25px;
            padding: 10px 15px;
            border-radius: 10px;
            transition: 0.2s;
            border: 1px solid var(--border-4);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .tab span {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            flex: 1;
            color: var(--text);
        }

        .tab:hover {
            background: var(--bg-3);
        }

        .tab.active {
            background: var(--bg-3);
            border: 1px solid var(--border-3);
        }

        .tab img {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        /* The close button is a Remixicon glyph: pages/slides.html does not load
           Font Awesome, so the old `fas fa-times` rendered as nothing at all. */
        .tab .close-btn {
            font-size: 18px;
            line-height: 1;
            padding: 2px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            color: var(--text);
            flex-shrink: 0;
        }

        .tab .close-btn:hover {
            color: var(--accent);
            background: var(--bg-4);
        }

        /* Arrows with nowhere to go are greyed out instead of silently doing
           nothing, and the star / console reflect their own state. */
        .slides-buttons button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .slides-buttons button.is-bookmarked,
        .slides-buttons button.is-active {
            border-color: var(--accent);
            color: var(--accent);
        }

        .newtab {
            background: var(--bg-2);
            height: 40px;
            width: 40px;
            border-radius: 10px;
            transition: 0.2s;
            cursor: pointer;
            border: 1px solid var(--border-4);
            color: var(--bright-text);
            flex-shrink: 0;
        }

        .newtab:hover {
            background: var(--bg-3);
            color: var(--bright-text);
        }

        /* A friendly card shown over the page area when a site answers with a bot
           challenge, a rate limit or an empty render, instead of leaving the
           frame blank. Purely presentational: it does not touch the request, the
           transport or the encoded proxy URL. It is a direct child of <body> and
           matches the frame's own box so it covers exactly the page area. */
        .frame-notice {
            --chrome: var(--slides-chrome-h, 104px);
            position: fixed;
            top: var(--chrome);
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 20px);
            height: calc(100vh - var(--chrome) - 10px);
            box-sizing: border-box;
            border-radius: 12px;
            border: 1px solid var(--border-3);
            /* Solid, no backdrop-filter: this covers the whole page area, and a
               full-frame blur is needless GPU work while the card is up. */
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 1002;
        }

        .frame-notice[hidden] {
            display: none;
        }

        .frame-notice-card {
            max-width: 460px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .frame-notice-card > i {
            font-size: 40px;
            color: var(--accent);
        }

        .frame-notice-title {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            color: var(--bright-text);
        }

        .frame-notice-body {
            margin: 0;
            font-size: 14px;
            line-height: 1.5;
            color: var(--text);
        }

        .frame-notice-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .frame-notice-actions button {
            height: 38px;
            padding: 0 16px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            background: var(--bg-2);
            border: 1px solid var(--border-4);
            color: var(--bright-text);
        }

        .frame-notice-actions button:hover {
            background: var(--bg-3);
        }

        .frame-notice-actions button.primary {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Keep the browser chrome usable on a phone: it stays one row and the URL
           bar shrinks instead of overflowing (elements.css gives every input
           width:400px), so the measured frame offset below it stays right. */
        @media (max-width: 780px) {
            .slides-controls {
                padding: 42px 8px 8px;
                gap: 6px;
            }

            .slides-buttons button,
            .newtab {
                height: 36px;
                width: 36px;
            }

            .slides-buttons input {
                height: 36px;
                padding: 0 12px;
                font-size: 13px;
            }

            .tab {
                max-width: 130px;
                min-width: 90px;
                height: 36px;
                padding: 6px 8px;
            }
        }
    </style>

    <div class="slides-container">
        <div class="slides-controls">
            <div class="tabs">
                <button class="newtab" onclick="newTab()">
                    <i class="ri-add-line ri"></i>
                </button>
            </div>
            <div class="slides-buttons">
                <div class="hcontainer">
                    <button data-nav="back" onclick="b()" title="Back">
                        <i class="ri-arrow-left-line ri"></i>
                    </button>
                    <button data-nav="forward" onclick="f()" title="Forward">
                        <i class="ri-arrow-right-line ri"></i>
                    </button>
                    <button data-nav="reload" onclick="r()" title="Reload">
                        <i class="ri-restart-line ri"></i>
                    </button>
                    <input type="text" id="searchbar" placeholder="Search for anything or enter a URL...">
                    <button id="bookmark-toggle" onclick="toggleBookmark()" title="Add to favourites">
                        <i class="ri-star-line ri"></i>
                    </button>
                    <button onclick="full()" title="Fullscreen">
                        <i class="ri-fullscreen-line ri"></i>
                    </button>
                    <button id="eruda-toggle" onclick="launchEruda()" title="Developer console">
                        <i class="ri-code-line ri"></i>
                    </button>
                    <button onclick="toggleFolders()" title="Proxy folders">
                        <i class="ri-settings-3-line ri"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Shown over the page area when a site answers with a bot challenge or an
         empty render, instead of leaving a blank frame. A direct child of <body>
         so it stacks above the page frames (z-index 1000). -->
    <div id="frameNotice" class="frame-notice" hidden>
        <div class="frame-notice-card">
            <i class="ri-alert-line ri"></i>
            <h2 class="frame-notice-title">The site is checking your browser</h2>
            <p class="frame-notice-body"></p>
            <div class="frame-notice-actions">
                <button class="primary" onclick="r()">Reload</button>
                <button onclick="dismissFrameNotice()">Dismiss</button>
            </div>
        </div>
    </div>

    <script defer>
        newTab()

        // The toolbar search box on this page was never connected to the browser,
        // so typing in it did nothing at all. Enter now searches or navigates the
        // same way the home page's boxes do.
        const slidesSearch = document.getElementById("searchbar")

        if (slidesSearch) {
            slidesSearch.addEventListener("keydown", (e) => {
                if (e.key !== "Enter") return

                const value = slidesSearch.value.trim()
                if (!value) return

                e.preventDefault()
                nav(value)
                slidesSearch.blur()
            })
        }
    </script>
    <div id="cursor-thank-you-zxs"

    </div>
