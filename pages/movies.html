<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies &amp; Shows</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.10.3/cdn.min.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fdn.fontcdn.ir">
    <link rel="preconnect" href="https://v1.fontapi.ir">
    <link href="https://v1.fontapi.ir/css/SFProDisplay" rel="stylesheet">
    <link rel="shortcut icon" href="/assets/img/fav.png" type="image/png">
    <script src="/assets/js/background.js" defer></script>
    <link rel="stylesheet" href="/assets/css/colors.css" id="css-theme-link">
    <script src="/assets/js/colors.js"></script>
    <link rel="stylesheet" href="/assets/css/font.css">
</head>

<style>

    button {
        font-family: arial !important;
    }

    html {
        /* Kermit (RTPK) backdrop, matching the rest of the site. Without it these
           pages fell back to the browser's white canvas and looked washed out. */
        background:
            radial-gradient(circle at 50% 8%,
                color-mix(in srgb, var(--accent) 26%, transparent), transparent 55rem),
            linear-gradient(color-mix(in srgb, var(--bg) 84%, transparent),
                color-mix(in srgb, var(--bg) 94%, transparent)),
            linear-gradient(135deg, var(--accent-2), var(--accent));
    }

    body {
        background: transparent;
    }

    @media (max-width: 780px) {
        body {
            padding: 16px !important;
        }
    }

    /* Match the Games page search field: the same base look as elements.css
       (10px radius, --bg-3 fill, 400px wide) rather than the rounded Tailwind
       pill this page used before. */
    .movie-search {
        width: 400px;
        max-width: 100%;
        box-sizing: border-box;
        height: 30px;
        padding: 10px;
        border: 1px solid var(--border-4) !important;
        border-radius: 10px !important;
        background: var(--bg-3) !important;
        color: white !important;
        font-size: 17px !important;
        font-family: Arial !important;
    }

    .movie-search:focus {
        outline: none;
        background: var(--bg-2) !important;
    }

    .switcher {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        font-family: arial;
    }

    /* Body padding without Tailwind's p-8 top inset, so the heading sits 18px
       from the top of the page. That is the same spot the Games heading takes
       (.hcenter { top: 0; padding-top: 18px } in pages/games.html). */
    body {
        padding: 18px 32px 32px;
        box-sizing: border-box;
    }

    /* Same gradient heading as the home page, instead of a plain white one. */
    .page-title {
        display: block;
        text-align: center;
        font-size: clamp(2rem, 5vw, 3rem);
        font-weight: 500;
        line-height: 1.15;
        margin: 0 0 18px;
        overflow-wrap: break-word;
        background: linear-gradient(to bottom right, var(--accent), var(--accent-2));
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
    }

    ::-webkit-scrollbar {
        scrollbar-width: thin;
    }
</style>

<body class="text-[var(--text)] min-h-screen" x-data="app()">
    <div class="container mx-auto">
        <h1 class="page-title">Movies &amp; Shows</h1>
        <br>
        <div class="mb-8 flex flex-col md:flex-row gap-4 transition-all duration-200 items-center justify-center">
            <input class="movie-search" type="text" x-model="searchQuery" @input="onSearchInput()"
                placeholder="Search for a movie/show" autocomplete="off">
        </div>
        <p class="text-center mb-4 opacity-70" x-text="status"></p>

        <div class="switcher">
            <button @click="currentTab = 'movies'" :class="currentTab === 'movies' ? 'bg-[var(--accent-2)] text-[var(--bright-text)]' : 'bg-[var(--bg-2)] hover:bg-[var(--bg-3)]'"
                class="px-4 py-2 rounded-2xl transition-all duration-200">
                Movies
            </button>
            <button @click="currentTab = 'shows'" :class="currentTab === 'shows' ? 'bg-[var(--accent-2)] text-[var(--bright-text)]' : 'bg-[var(--bg-2)] hover:bg-[var(--bg-3)]'"
                class="px-4 py-2 rounded-2xl transition-all duration-200">
                TV &amp; Shows
            </button>
        </div>

        <br><br><br>

        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-4 gap-4">
            <template x-for="item in content" :key="item.id">
                <a :href="'watch.html?id=' + item.id + '&type=' + (currentTab === 'movies' ? 'movie' : 'tv')"
                    class="bg-[var(--bg-2)] rounded-3xl overflow-hidden hover:scale-[102%] transition-transform block relative group">
                    <img :src="'https://image.tmdb.org/t/p/w500' + item.poster_path" :alt="item.title || item.name"
                        class="w-full aspect-[3/2] object-cover transition-all duration-200">
                    <div
                        class="absolute inset-0 bg-black/0 group-hover:bg-black/50 hover:backdrop-blur-[2px] transition-all duration-200 flex items-end p-3 opacity-0 group-hover:opacity-100">
                        <h3 class="text-sm font-semibold text-[var(--text)]" x-text="item.title || item.name"></h3>
                    </div>
                </a>
            </template>
        </div>

        <div class="mt-8 flex justify-center space-x-4">
            <button @click="currentPage > 1 && changePage(currentPage - 1)" :disabled="currentPage === 1"
                class="bg-[var(--bg-2)] px-6 py-2 rounded-2xl transition-all duration-200 hover:bg-[var(--bg-3)] disabled:opacity-50 disabled:hover:bg-[var(--bg-2)] disabled:cursor-not-allowed">
                Previous
            </button>
            <span class="px-6 py-2" style="font-family: arial;">Page <span x-text="currentPage" style="font-family: arial;"></span></span>
            <button @click="changePage(currentPage + 1)"
                class="bg-[var(--bg-2)] px-6 py-2 rounded-2xl transition-all duration-200 hover:bg-[var(--bg-3)]">
                Next
            </button>
        </div>
        <br><br>
    </div>

    <script>
        function app() {
            return {
                apiKey: 'fb7bb23f03b6994dafc674c074d01761',
                content: [],
                currentTab: 'movies',
                currentPage: 1,
                searchQuery: '',
                status: '',
                requestId: 0,
                searchTimer: null,

                async init() {
                    await this.fetchContent();

                    this.$watch('currentTab', async () => {
                        this.currentPage = 1;
                        this.searchQuery = '';
                        await this.fetchContent();
                    });
                },

                // Typing used to fire one request per keystroke and always reused
                // whatever page you were on, so a slow early reply could land last
                // and replace the results for what you had actually typed. Now it
                // waits for a pause, goes back to page 1, and drops stale replies.
                onSearchInput() {
                    clearTimeout(this.searchTimer);
                    this.searchTimer = setTimeout(async () => {
                        this.currentPage = 1;
                        await this.searchContent();
                    }, 350);
                },

                async searchContent() {
                    if (!this.searchQuery.trim()) {
                        this.status = '';
                        await this.fetchContent();
                        return;
                    }

                    const request = ++this.requestId;
                    const baseUrl = 'https://api.tmdb.org/3';
                    const endpoint = this.currentTab === 'movies' ? 'movie' : 'tv';
                    const url = `${baseUrl}/search/${endpoint}?api_key=${this.apiKey}&query=${encodeURIComponent(this.searchQuery)}&page=${this.currentPage}`;

                    try {
                        const response = await fetch(url, {
                            method: 'GET',
                            headers: {
                                'Accept': 'application/json',
                            }
                        });

                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }

                        const data = await response.json();
                        if (request !== this.requestId) return;

                        this.content = data.results || [];
                        this.status = this.content.length
                            ? ''
                            : 'No ' + (this.currentTab === 'movies' ? 'movies' : 'shows') + ' matched "' + this.searchQuery + '".';
                    } catch (error) {
                        console.error('Error searching content:', error);
                        if (request !== this.requestId) return;

                        this.content = [];
                        this.status = 'Search failed. Check your connection and try again.';
                    }
                },

                async fetchContent() {
                    const baseUrl = 'https://api.tmdb.org/3';
                    const endpoint = this.currentTab === 'movies' ? 'movie/popular' : 'tv/popular';
                    const url = `${baseUrl}/${endpoint}?api_key=${this.apiKey}&page=${this.currentPage}`;

                    try {
                        const response = await fetch(url, {
                            method: 'GET',
                            headers: {
                                'Accept': 'application/json',
                            }
                        });

                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }

                        const data = await response.json();
                        this.content = data.results || [];
                        this.status = '';
                    } catch (error) {
                        console.error('Error fetching content:', error);
                        this.content = [];
                        this.status = 'Could not load titles from TMDB. Check your connection and try again.';
                    }
                },

                async changePage(page) {
                    this.currentPage = page;
                    if (this.searchQuery.trim()) {
                        await this.searchContent();
                    } else {
                        await this.fetchContent();
                    }
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }
        }
    </script>
    <div id="cursor-thank-you-zxs"
        style="position: fixed; top: 0px; left: 0px; width: 16px; height: 16px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 70%, white 30%); pointer-events: none; z-index: 9999; transform: translate(748px, 592px); transition: width 0.15s, height 0.15s, opacity 0.15s; mix-blend-mode: difference; opacity: 0;">
    </div>
    <script src="/assets/js/cursor.js"></script>
</body>

</html>
