<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kermit (RTPK) Network | play</title>
    <link rel="shortcut icon" href="/assets/img/fav.png" type="image/png" id="tabIcon">
    <script src="/assets/js/background.js" defer></script>
    <link rel="stylesheet" href="/assets/css/colors.css" id="css-theme-link">
    <link rel="stylesheet" href="/assets/css/elements.css">
    <link rel="stylesheet" href="/assets/css/font.css">
    <link rel="stylesheet" href="/assets/icons/fonts/remixicon.css">
    <script src="/assets/js/colors.js"></script>
    <script src="/assets/js/firebase-config.js"></script>
    <script src="/assets/js/account.js" defer></script>
    <link rel="stylesheet" href="/assets/css/overlay.css">
</head>

<body style="background: none !important;">



    <style>
        #particles-container {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            opacity: 0.5;
        }

        .container {
            display: flex;
        }

        .centerc {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            position: absolute;
        }

        h1 {
            color: var(--bright-text);
            font-size: 2.5rem;
        }

        .hcenter {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .app {
            width: 280px;
            height: 100px;
            border-radius: 15px;
            background: var(--bg-4);
            border: 1px solid var(--border-4);
            margin: 10px;
            transition: outline 0.05s ease, background 0.1s;
            outline: 0px solid var(--accent);
            position: relative;
            z-index: 1;
        }

        .app:hover {
            background: var(--bg-3);
            cursor: pointer;
        }

        .app img {
            height: 70px;
            width: 70px;
            margin: 15px;
            border-radius: 10px;
        }

        .app h2 {
            color: var(--bright-text);
            position: relative;
            top: 0%;
            transform: translateY(30%);
            font-size: 20px;
        }

        .apps-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            width: 90%;
            z-index: 0;
        }

        ::-webkit-scrollbar {
            scrollbar-width: none;
        }

        #gameframe {
            width: 95vw;
            height: 80vh;
            background: var(--bg-3);
            border: 1px solid var(--border-4);
            border-radius: 20px;
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
        }

        .gamecontrols {
            background: var(--bg-2);
            height: 60px;
            width: 95vw;
            position: relative;
            top: -4px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            border: 1px solid var(--border-4);
            overflow: hidden;
        }

        .gamestuff {
            position: absolute;
            transform: translate(-50%, -50%);
            left: 50%;
            top: 50%;
            width: 95vw;
            max-width: 95vw;
        }

        /* Three equal controls that fill the bar: the old rules used 33.35%
           widths with negative margins, which overlapped and clipped the
           middle button. */
        .gamestuff button {
            flex: 1 1 0;
            min-width: 0;
            border-radius: 0;
            border: 0;
            background: transparent;
            color: var(--bright-text);
            font-size: 22px;
            cursor: pointer;
            text-align: center;
            height: 100%;
            margin: 0;
            transition: 0.2s;
        }

        .gamestuff .gamecontrols {
            display: flex;
            align-items: stretch;
        }

        .gamestuff button:hover {
            background: var(--bg-4);
        }

        #bottom-tip {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 5px;
            font-size: 14px;
            font-weight: 500;
            font-style: italic;
            opacity: .5;
        }

        .overlay-notice {
            background: var(--bg-5);
            color: var(--text);
            padding: 10px;
            border: 1px solid var(--border-4);
            border-radius: 15px;
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: 0.4s;
            z-index: 3298746986;
            /* This sits in the middle of the game frame. Without this it stayed
               invisible but kept swallowing every click aimed at the game. */
            pointer-events: none;
        }
    </style>

    <div id="particles-container"></div>

    <div class="gamestuff">
        <iframe frameborder="0" id="gameframe" allowfullscreen></iframe>
        <div class="gamecontrols">
            <button onclick="refreshGame()" title="Restart">
                <i class="ri-restart-line"></i>
            </button>
            <!-- Toggles this game in and out of fullscreen; the glyph follows
                 the state (see syncFullscreenButton). -->
            <button id="fullscreenBtn" onclick="fullscreenGame()" title="Fullscreen">
                <i class="ri-fullscreen-line" data-fullscreen-icon></i>
            </button>
            <button onclick="backToGames()" title="Back to games">
                <i class="ri-arrow-left-line"></i>
            </button>
            <button onclick="popoutGame()" title="Pop out">
                <i class="ri-external-link-line"></i>
            </button>
        </div>
    </div>

    <div class="overlay-notice">
        Press Alt + G to open the Game Overlay
    </div>

    <div id="gameOverlay" class="">
        <div class="kermit-info">
            <span id="currentTime">Loading time...</span>
            <span class="divider"></span>
            <span id="temperature">Loading temp...</span>
            <span class="divider"></span>
            <span id="sessionTime">Loading session time...</span>
        </div>
        <div class="record-widget">
            <h1>Record</h1>
            <button id="startRecording" style="margin-left: 0;" onclick="startRecording()">
                <i class="ri-record-circle-line"></i>
            </button>
            <button id="stopRecording" disabled style="margin-right: 0;" onclick="stopRecording()">
                <i class="ri-stop-fill"></i>
            </button>
        </div>
        <div class="game-controls">
            <h1>Game Controls</h1>
            <button style="margin-left: 0;"
                    onclick="refreshGame()" title="Restart">
                <i class="ri-restart-line"></i>
            </button>
            <button onclick="fullscreenGame()" title="Fullscreen">
                <i class="ri-fullscreen-line" data-fullscreen-icon></i>
            </button>
            <button onclick="backToGames()" title="Back to games">
                <i class="ri-arrow-left-line"></i>
            </button>
            <button onclick="popoutGame()" title="Pop out">
                <i class="ri-external-link-line"></i>
            </button>
            <button onclick="downloadGame()" id="downloadBtn" title="Download">
                <i class="ri-download-line"></i>
            </button>
            <button style="margin-right: 0;" onclick="window.location.href = '/pages/games.html'" title="Back to games">
                <i class="ri-door-open-line"></i>
            </button>
        </div>
        <iframe src="/pages/browser-minimum.html" frameborder="0" class="proxy-widget"></iframe>
    </div>

    <p id="bottom-tip">If a game doesn't work, try popping it out!</p>

    <script>
        const ul = document.getElementById("nav-ul")

        document.querySelectorAll("li a").forEach(link => {
            link.addEventListener("click", function () {
                document.querySelectorAll("li a").forEach(l => l.classList.remove("active"));
                this.classList.add("active");
            });
        });

        window.addEventListener("keydown", (e) => {
            if (e.ctrlKey && e.key === "m") {
                console.log("Key pressed")
                e.preventDefault()
                if (!ul.classList.contains("active")) {
                    ul.classList.add("active")
                    const blurr = document.createElement("div")
                    blurr.classList.add("bluroverlay")
                    document.body.append(blurr)
                    blurr.addEventListener("click", () => {
                        blurr.remove()
                        ul.classList.remove("active")
                    })
                } else {
                    ul.classList.remove("active")
                    const blurr = document.querySelector(".bluroverlay")
                    blurr.remove()
                }
            }
        })

        const gameframe = document.getElementById('gameframe');
        const urlParams = new URLSearchParams(window.location.search);
        const gameurl = urlParams.get('launch');
        // Kept so one-time LuminSDK URLs can be re-minted on restart / pop-out
        // (the SDK docs say getGameUrl returns a single-use token).
        let currentLaunch = null;

        // Noah's Hub game pages come from githack, but a chunk of them declare a
        // <base href> pointing at a jsDelivr org that jsDelivr now blocks (403),
        // so those games render blank. githack mirrors the same GitHub repos, so
        // for those pages we fetch the HTML, swap the blocked orgs over to githack
        // and load the rewritten page from a blob URL. Everything else loads as-is.
        const NOAHS_HUB_HTML = "https://rawcdn.githack.com/NoahsAmazingTutoringHelp/Noahs-Calculus-Tutor/master/";
        // UGS single-file games are served from unpkg as text/plain and load
        // their assets from a jsDelivr GitHub org that is blocked (403). We fetch
        // those pages, point the blocked jsDelivr refs at githack (which mirrors
        // the same GitHub repos with the right MIME type) and load the result
        // from a blob URL. Everything else is used as-is.
        const UGS_SINGLE = "https://unpkg.com/ugs-singlefiles@1.0.6/UGS-Files/";
        const BLOCKED_CDNS = /https?:\/\/cdn\.jsdelivr\.net\/gh\/(genizy|gn-math|bubbls)\//g;
        const JSDELIVR_GH = /https?:\/\/cdn\.jsdelivr\.net\/gh\/([^@\/\s"']+)\/([^@\/\s"']+)@([^\/\s"']+)\//g;

        function rewriteRemote(src) {
            return fetch(src, { cache: "no-cache" })
                .then(res => res.ok ? res.text() : null)
                .then(html => {
                    if (!html) return src;
                    const rewritten = html
                        .replace(JSDELIVR_GH, "https://rawcdn.githack.com/$1/$2/$3/")
                        .replace(BLOCKED_CDNS, "https://rawcdn.githack.com/$1/");
                    if (rewritten === html) return src;
                    // The page now runs from a blob: keep relative paths pointing
                    // at the folder it was served from.
                    let out = rewritten;
                    if (!/<base[\s>]/i.test(out)) {
                        const base = src.replace(/[^\/]*$/, "");
                        out = out.replace(/<head([^>]*)>/i, '<head$1><base href="' + base + '">');
                    }
                    return URL.createObjectURL(new Blob([out], { type: "text/html" }));
                })
                .catch(() => src);
        }

        function noahsHubSrc(src) {
            if (!src || src.indexOf(NOAHS_HUB_HTML) !== 0) return Promise.resolve(src);
            return rewriteRemote(src);
        }

        function ugsSrc(src) {
            if (!src || src.indexOf(UGS_SINGLE) !== 0) return Promise.resolve(src);
            return rewriteRemote(src);
        }

        // LuminSDK games are addressed by id and resolved to a fresh one-time
        // playable URL each time. The SDK is published as two byte-identical
        // builds; Lightspeed Systems (lightspeedsystems.com) blanket-blocks any
        // site that loads the build named after the SDK, so we load the
        // identical "fonts.min.js" build from the same base URL instead.
        const LUMIN_SDK = "https://cdn.jsdelivr.net/gh/luminsdk/script@latest/fonts.min.js";
        const LUMIN_PREFIX = "lumin:";
        let luminScript = null;

        function loadLuminScript() {
            if (!luminScript) {
                luminScript = new Promise((resolve, reject) => {
                    const s = document.createElement("script");
                    s.src = LUMIN_SDK;
                    s.async = true;
                    s.onload = () => resolve();
                    s.onerror = () => reject(new Error("LuminSDK script failed to load"));
                    document.head.appendChild(s);
                });
            }
            return luminScript;
        }

        function luminSrc(src) {
            if (!src || src.indexOf(LUMIN_PREFIX) !== 0) return Promise.resolve(src);
            const id = src.slice(LUMIN_PREFIX.length);
            return loadLuminScript()
                .then(() => Lumin.init({ headless: true }))
                .then(() => Lumin.getGameUrl(id))
                .then(res => (res && res.url) ? res.url : src)
                .catch(e => {
                    console.error("Could not load this LuminSDK game:", e);
                    return src;
                });
        }

        function loadGame(src) {
            gameframe.src = src;
            gameframe.focus()
            // Only the games vendored under /stores/gn-math can actually be
            // downloaded; remote repo games are cross-origin downloads.
            document.getElementById("downloadBtn").style.display =
                (src && src.indexOf("/stores/gn-math/") !== -1) ? "" : "none"
            gameframe.onload = () => {
                // Games hosted on another domain have no reachable contentDocument
                // (and a few entries, like Territorial.io, are external links).
                let doc = null
                try {
                    doc = gameframe.contentDocument
                } catch (e) {
                    doc = null
                }
                if (!doc || !doc.head) return
                const head = doc.head

                const script = doc.createElement("script");
                script.textContent = `
                    window.addEventListener("keydown", (e) => {
                        if (e.altKey && e.code === "KeyG") {
                            parent.postMessage({ type: "alt-g" }, "*");
                        }
                    });
                `

                head.appendChild(script)
            }
        }

        // Store games are served through stores/sw.js, which gives them back a
        // working localStorage so they can save progress (see that file). Wait a
        // moment for the worker to activate, then load the game either way -
        // without the worker the game still plays, it just cannot save.
        function gameStorageReady() {
            if (!("serviceWorker" in navigator)) return Promise.resolve()

            return navigator.serviceWorker.register("/stores/sw.js")
                .then(registration => {
                    if (registration.active) return

                    const worker = registration.installing || registration.waiting
                    if (!worker) return

                    return new Promise(resolve => {
                        worker.addEventListener("statechange", () => {
                            if (worker.state === "activated") resolve()
                        })
                        setTimeout(resolve, 1500)
                    })
                })
                .catch(() => { })
        }

        // Signed-in players get their cloud saves applied before the game
        // reads localStorage, so progress made on another device (or another
        // link) is already there when this game starts. account.js is deferred,
        // so give it a moment to appear; local-only and unconfigured sessions
        // never wait.
        function waitForAccount(timeout = 1500) {
            return new Promise(resolve => {
                if (window.KERMIT_ACCOUNT) return resolve(window.KERMIT_ACCOUNT)
                const started = Date.now()
                const tick = setInterval(() => {
                    if (window.KERMIT_ACCOUNT || Date.now() - started > timeout) {
                        clearInterval(tick)
                        resolve(window.KERMIT_ACCOUNT)
                    }
                }, 50)
            })
        }

        function cloudProgressReady() {
            return waitForAccount().then(A => {
                if (!A || !A.configured || !A.configured()) return
                // Signed-out sessions resolve immediately (no account, no wait).
                return (A.whenReady ? A.whenReady(3000) : Promise.resolve()).catch(() => { })
            })
        }

        if (gameurl) {
            const gameUrl = decodeURIComponent(gameurl)
            currentLaunch = gameUrl

            if (gameUrl.startsWith("/stores/")) {
                gameStorageReady().then(() => cloudProgressReady()).then(() => loadGame(gameUrl))
            } else {
                cloudProgressReady().then(() => noahsHubSrc(gameUrl).then(ugsSrc).then(luminSrc).then(loadGame))
            }
        }

        // LuminSDK URLs carry a single-use token (see the SDK docs), so re-assigning
        // the same src fails the second time it is loaded. Re-resolve the game to
        // mint a fresh URL first; every other source just reloads as-is. An empty
        // result means resolution failed, so the current frame is left untouched
        // rather than being pointed at an unusable "lumin:" handle.
        function playableSrc() {
            if (currentLaunch && currentLaunch.indexOf(LUMIN_PREFIX) === 0) {
                return luminSrc(currentLaunch).then(src =>
                    (src && src.indexOf(LUMIN_PREFIX) !== 0) ? src : "");
            }
            return Promise.resolve(gameframe.src);
        }

        function refreshGame() {
            playableSrc().then(src => {
                if (src) gameframe.src = src;
                gameframe.focus();
            });
        }

        // Each game gets its own fullscreen toggle: the first press puts that
        // game's frame on the whole screen, the next one brings it back. The
        // button glyph mirrors the real state, including when the browser leaves
        // fullscreen on its own (Esc).
        function fullscreenGame() {
            const doc = document;
            const isFull = doc.fullscreenElement || doc.webkitFullscreenElement || doc.msFullscreenElement;

            if (isFull) {
                const exit = doc.exitFullscreen || doc.webkitExitFullscreen || doc.msExitFullscreen;
                if (exit) {
                    const r = exit.call(doc);
                    if (r && typeof r.catch === "function") r.catch(() => { });
                }
                gameframe.focus();
                return;
            }

            const request = gameframe.requestFullscreen || gameframe.mozRequestFullScreen ||
                gameframe.webkitRequestFullscreen || gameframe.msRequestFullscreen;

            if (!request) {
                alert("Fullscreen is not available in this browser.");
                return;
            }

            const result = request.call(gameframe);
            if (result && typeof result.catch === "function") result.catch(() => { });
            gameframe.focus();
        }

        // Both fullscreen buttons (the bottom bar and the overlay) show the same
        // state, so the glyph is synced on every icon that opts in.
        function syncFullscreenButton() {
            const isFull = document.fullscreenElement || document.webkitFullscreenElement ||
                document.msFullscreenElement;

            document.querySelectorAll("[data-fullscreen-icon]").forEach(icon => {
                icon.className = isFull ? "ri-fullscreen-exit-line" : "ri-fullscreen-line";
                const btn = icon.closest("button");
                if (btn) btn.title = isFull ? "Exit fullscreen" : "Fullscreen";
            });
        }

        ["fullscreenchange", "webkitfullscreenchange", "MSFullscreenChange"].forEach(evt =>
            document.addEventListener(evt, syncFullscreenButton));
        syncFullscreenButton();

        // Back returns to the games catalogue. When the player was opened from
        // the site (a real history entry) that is one step back, so the source
        // list and search term the user had are kept; a direct link falls back
        // to the catalogue page itself.
        function backToGames() {
            if (document.referrer && document.referrer.indexOf(window.location.origin) === 0) {
                window.history.back();
                return;
            }
            window.location.href = "/pages/games.html";
        }

        function popoutGame() {
            playableSrc().then(src => {
                if (src) window.open(src, '_blank');
                gameframe.focus();
            });
        }

        const useOverlay = localStorage.getItem("cherri_useOverlay") ?? "yes"

        if (useOverlay === "yes") {
            initOverlay()
        }

        function initOverlay() {
            const controls = document.querySelector(".gamecontrols")
            const frame = document.querySelector("#gameframe")
            const overlay = document.getElementById("gameOverlay")
            const overlayNotice = document.querySelector(".overlay-notice")
            controls.style.display = "none"
            document.querySelector("#bottom-tip").style.display = "none"
            frame.style.height = "100vh"
            frame.style.width = "100vw"
            frame.style.border = "none"
            frame.style.borderRadius = "0"
            setTimeout(() => {
                overlayNotice.style.opacity = 1
            }, 500)
            setTimeout(() => {
                overlayNotice.style.opacity = 0
            }, 3000)
            window.addEventListener("message", (ev) => {
                if (ev.data.type === "alt-g") {
                    if (overlay.classList.contains("active")) {
                        overlay.classList.remove("active")
                    } else {
                        overlay.classList.add("active")
                    }
                }
            });
            document.addEventListener("keydown", (e) => {
                if (e.altKey && e.key === "g") {
                    if (overlay.classList.contains("active")) {
                        overlay.classList.remove("active")
                    } else {
                        overlay.classList.add("active")
                    }
                }
            })
        }

        async function getTemp() {
            const loc = await fetch("https://ipapi.co/json/").then(r => r.json());
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current_weather=true`;
            const weather = await fetch(url).then(r => r.json());
            return weather.current_weather.temperature;
        }

        getTemp().then(t => {
            document.getElementById("temperature").textContent = Math.trunc((t * 1.8) + 32) + "°F";
        });

        function getOSTime() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        }

        setInterval(getOSTime(), 60000)

        document.getElementById("currentTime").textContent = getOSTime()

        let recorder;
        let chunks = [];

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: {
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        frameRate: { ideal: 60 }
                    },
                    audio: true
                });
                document.getElementById("stopRecording").disabled = false
                document.getElementById("startRecording").style.background = "var(--accent)"

                recorder = new MediaRecorder(stream);

                recorder.ondataavailable = e => chunks.push(e.data);

                recorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: "video/mp4" });
                    chunks = [];

                    stream.getTracks().forEach(track => track.stop());

                    try {
                        const handle = await window.showSaveFilePicker({
                            suggestedName: "Kermit_Game_Recording" + Date.now() + ".mp4",
                            types: [{
                                description: "Video Files",
                                accept: { "video/mp4": [".mp4"] }
                            }]
                        });

                        const writable = await handle.createWritable();
                        await writable.write(blob);
                        await writable.close();

                    } catch (err) {
                        if (err.name !== "AbortError") {
                            console.error("Save failed:", err);
                        }
                    }
                };

                recorder.start();

                console.log("Screen recording started");
                document.getElementById("stopRecording").disabled = false
                document.getElementById("startRecording").style.pointerEvents = "none"


            } catch (err) {
                console.error("Error:", err);
            }
        }

        function stopRecording() {
            recorder.stop();
            console.log("STOP.")
            document.getElementById("stopRecording").disabled = true
            document.getElementById("startRecording").style.background = "var(--bg-2)"
            document.getElementById("startRecording").style.pointerEvents = "auto"
        }

        const sT = document.getElementById("sessionTime")
        window.addEventListener("DOMContentLoaded", () => {
            let elapsed = 0

            function format(ms) {
                let totalSeconds = Math.floor(ms / 1000)
                let hours = Math.floor(totalSeconds / 3600)
                let minutes = Math.floor((totalSeconds % 3600) / 60)
                let seconds = totalSeconds % 60

                hours = hours < 10 ? '0' + hours : hours;
                minutes = minutes < 10 ? '0' + minutes : minutes;
                seconds = seconds < 10 ? '0' + seconds : seconds;

                return `${hours}:${minutes}:${seconds}`;
            }

            setInterval(() => {
                elapsed = 1000 + elapsed
                sT.textContent = format(elapsed)
            }, 1000)
        })


        function downloadGame() {
            const src = document.getElementById("gameframe").src
            const download = document.createElement("a")
            download.href = src
            download.download = src.replace(`${window.location.origin}/stores/gn-math/`, "")
            document.body.append(download)
            download.click()
            download.remove()
        }
    </script>
    <div id="cursor-thank-you-zxs"
        style="position: fixed; top: 0px; left: 0px; width: 16px; height: 16px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 70%, white 30%); pointer-events: none; z-index: 9999; transform: translate(748px, 592px); transition: width 0.15s, height 0.15s, opacity 0.15s; mix-blend-mode: difference; opacity: 0;">
    </div>
    <script src="/assets/js/cursor.js"></script>
</body>
