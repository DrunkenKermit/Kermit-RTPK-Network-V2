<!DOCTYPE html>
<!-- data-settings="proxy": this page's Settings icon shows the proxy/network
     options only. Every other page shows the general site options instead. -->
<html lang="en" data-settings="proxy">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kermit (RTPK) Network | browser</title>
    <link rel="shortcut icon" href="/assets/img/fav.png" type="image/png" id="tabIcon">
    <script src="/assets/js/background.js" defer></script>
    <link rel="stylesheet" href="/assets/css/colors.css" id="css-theme-link">
    <link rel="stylesheet" href="/assets/css/elements.css">
    <link rel="stylesheet" href="/assets/css/font.css">
    <link rel="stylesheet" href="/assets/icons/fonts/remixicon.css">
    <!-- Settings open over this page instead of sending you back to the home
         page (see assets/js/settings.js). -->
    <link rel="stylesheet" href="/assets/css/t.css">
    <link rel="stylesheet" href="/assets/css/dropdown.css">
    <link rel="stylesheet" href="/assets/css/settings.css">
    <script src="/baremux/index.js"></script>
    <!-- Ultraviolet: without these, choosing the Ultraviolet backend in Settings
         throws "__uv$config is not defined" and the browser stops navigating. -->
    <script src="/uv/uv.bundle.js"></script>
    <script src="/uv/uv.config.js"></script>
    <script src="/assets/js/colors.js"></script>
    <script src="/assets/js/firebase-config.js"></script>
    <script src="/assets/js/account.js" defer></script>
    <script src="/homework/math.all.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/eruda@3.4.3/eruda.min.js"></script>
    <script>
        async function swium() {
            await navigator.serviceWorker.register("/uv/sw.js").then(() => {
                console.log(
                    "%cKermit" + "%c UV sw registered!",
                    "color: white; background: linear-gradient(to bottom right, #0d8f3f, #63ff93); border-radius: 5px; font-weight: bold; padding: 6px; font-family: monospace;",
                    "color: white; background: transparent; border-radius: 0px; padding: 0px;"
                );
            }).catch(e => {
                console.log("Error registering service worker (UV): " + e)
            });

            await navigator.serviceWorker.register("/sw.js").then(() => {
                console.log(
                    "%cKermit" + "%c SJ sw registered!",
                    "color: white; background: linear-gradient(to bottom right, #e2588d, #dbd7d7); border-radius: 5px; font-weight: bold; padding: 6px; font-family: monospace;",
                    "color: white; background: transparent; border-radius: 0px; padding: 0px;"
                );
            }).catch(e => {
                console.log("Error registering service worker (SJ): " + e)
            });
        }

        window.addEventListener("load", () => {
            swium();
        });
    </script>
    <script src="/assets/js/browserfunctions.js"></script>
</head>

<body>

    <style>
        .browser-container {
            background: var(--bg);
            width: 100%;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 6;
            transition: 0.2s;
        }

        .browser-frame {
            /* The controls bar measures its own height (see layoutChrome in
               assets/js/browserfunctions.js), so the page frame always starts
               below the real chrome and can never be covered by it. */
            --chrome: var(--browser-chrome-h, 104px);
            width: calc(100% - 20px);
            height: calc(100vh - var(--chrome) - 10px);
            position: fixed;
            top: var(--chrome);
            left: 50%;
            transform: translateX(-50%);
            border-radius: 12px;
            border: 1px solid var(--border-3);
            display: none;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
        }

        .browser-frame.active {
            display: block;
            opacity: 1;
            pointer-events: all;
        }

        /* One stacked chrome: the tab strip sits on top of a single full-width
           control row. The old layout absolutely positioned the control row 35px
           down and 95% wide, so it collided with the tabs and wasted the sides. */
        .browser-controls {
            position: fixed;
            width: 100%;
            left: 0;
            top: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 8px;
            /* Extra top padding keeps a comfortable gap between the browser
               tabs and the toolbar above them. */
            padding: 48px 12px 10px;
            background: color-mix(in srgb, var(--bg) 82%, transparent 18%);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-4);
            /* Never let the chrome grow to swallow the page on a short screen. */
            max-height: calc(100vh - 120px);
            overflow-y: auto;
            z-index: 1001;
        }

        .tabs {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 0px;
            padding-bottom: 2px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .browser-buttons {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .browser-buttons .hcontainer {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
            min-width: 0;
        }

        .browser-buttons button {
            height: 40px;
            width: 40px;
            flex-shrink: 0;
            padding: 0;
            font-size: 16px;
            border-radius: 10px;
            transition: 0.2s;
            cursor: pointer;
            background: var(--bg-2);
            border: 1px solid var(--border-4);
            color: var(--bright-text);
        }

        .browser-buttons button:hover {
            background: var(--bg-3);
            color: var(--bright-text);
        }

        .ri {
            font-size: 20px;
        }

        .browser-buttons input {
            background: var(--bg-3);
            border: 1px solid var(--border-4);
            border-radius: 10px;
            height: 40px;
            padding: 0 20px;
            flex: 1;
            transition: 0.2s;
            color: var(--bright-text);
            font-family: Inter;
            outline: none;
            font-size: 14px;
        }

        .browser-buttons input:focus {
            outline: none;
            border: 1px solid var(--accent);
        }

        .browser-buttons input::placeholder {
            color: var(--text);
        }

        .tab {
            background: var(--bg-2);
            max-width: 200px;
            min-width: 25px;
            padding: 10px 15px;
            border-radius: 10px;
            transition: 0.2s;
            border: 1px solid var(--border-4);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .tab span {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            flex: 1;
            color: var(--text);
        }

        .tab:hover {
            background: var(--bg-3);
        }

        .tab.active {
            background: var(--bg-3);
            border: 1px solid var(--border-3);
        }

        .tab img {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        /* The close button is a Remixicon glyph: pages/browser.html does not load
           Font Awesome, so the old `fas fa-times` rendered as nothing at all. */
        .tab .close-btn {
            font-size: 18px;
            line-height: 1;
            padding: 2px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            color: var(--text);
            flex-shrink: 0;
        }

        .tab .close-btn:hover {
            color: var(--accent);
            background: var(--bg-4);
        }

        /* Arrows with nowhere to go are greyed out instead of silently doing
           nothing, and the star / console reflect their own state. */
        .browser-buttons button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .browser-buttons button.is-bookmarked,
        .browser-buttons button.is-active {
            border-color: var(--accent);
            color: var(--accent);
        }

        .newtab {
            background: var(--bg-2);
            height: 40px;
            width: 40px;
            border-radius: 10px;
            transition: 0.2s;
            cursor: pointer;
            border: 1px solid var(--border-4);
            color: var(--bright-text);
            flex-shrink: 0;
        }

        .newtab:hover {
            background: var(--bg-3);
            color: var(--bright-text);
        }

        /* A friendly card shown over the page area when a site answers with a bot
           challenge, a rate limit or an empty render, instead of leaving the
           frame blank. Purely presentational: it does not touch the request, the
           transport or the encoded proxy URL. It is a direct child of <body> and
           matches the frame's own box so it covers exactly the page area. */
        .frame-notice {
            --chrome: var(--browser-chrome-h, 104px);
            position: fixed;
            top: var(--chrome);
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 20px);
            height: calc(100vh - var(--chrome) - 10px);
            box-sizing: border-box;
            border-radius: 12px;
            border: 1px solid var(--border-3);
            /* Solid, no backdrop-filter: this covers the whole page area, and a
               full-frame blur is needless GPU work while the card is up. */
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 1002;
        }

        .frame-notice[hidden] {
            display: none;
        }

        .frame-notice-card {
            max-width: 460px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .frame-notice-card > i {
            font-size: 40px;
            color: var(--accent);
        }

        .frame-notice-title {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            color: var(--bright-text);
        }

        .frame-notice-body {
            margin: 0;
            font-size: 14px;
            line-height: 1.5;
            color: var(--text);
        }

        .frame-notice-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .frame-notice-actions button {
            height: 38px;
            padding: 0 16px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            background: var(--bg-2);
            border: 1px solid var(--border-4);
            color: var(--bright-text);
        }

        .frame-notice-actions button:hover {
            background: var(--bg-3);
        }

        .frame-notice-actions button.primary {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Keep the browser chrome usable on a phone: it stays one row and the URL
           bar shrinks instead of overflowing (elements.css gives every input
           width:400px), so the measured frame offset below it stays right. */
        @media (max-width: 780px) {
            .browser-controls {
                padding: 42px 8px 8px;
                gap: 6px;
            }

            .browser-buttons button,
            .newtab {
                height: 36px;
                width: 36px;
            }

            .browser-buttons input {
                height: 36px;
                padding: 0 12px;
                font-size: 13px;
            }

            .tab {
                max-width: 130px;
                min-width: 90px;
                height: 36px;
                padding: 6px 8px;
            }
        }
    </style>

    <div class="browser-container">
        <div class="browser-controls">
            <div class="tabs">
                <button class="newtab" onclick="newTab()">
                    <i class="ri-add-line ri"></i>
                </button>
            </div>
            <div class="browser-buttons">
                <div class="hcontainer">
                    <button data-nav="back" onclick="b()" title="Back">
                        <i class="ri-arrow-left-line ri"></i>
                    </button>
                    <button data-nav="forward" onclick="f()" title="Forward">
                        <i class="ri-arrow-right-line ri"></i>
                    </button>
                    <button data-nav="reload" onclick="r()" title="Reload">
                        <i class="ri-restart-line ri"></i>
                    </button>
                    <input type="text" id="searchbar" placeholder="Search for anything or enter a URL...">
                    <button id="bookmark-toggle" onclick="toggleBookmark()" title="Add to favourites">
                        <i class="ri-star-line ri"></i>
                    </button>
                    <button onclick="full()" title="Fullscreen">
                        <i class="ri-fullscreen-line ri"></i>
                    </button>
                    <button id="eruda-toggle" onclick="launchEruda()" title="Developer console">
                        <i class="ri-code-line ri"></i>
                    </button>
                    <button onclick="toggleSettings()" title="Proxy settings">
                        <i class="ri-settings-3-line ri"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Shown over the page area when a site answers with a bot challenge or an
         empty render, instead of leaving a blank frame. A direct child of <body>
         so it stacks above the page frames (z-index 1000). -->
    <div id="frameNotice" class="frame-notice" hidden>
        <div class="frame-notice-card">
            <i class="ri-alert-line ri"></i>
            <h2 class="frame-notice-title">The site is checking your browser</h2>
            <p class="frame-notice-body"></p>
            <div class="frame-notice-actions">
                <button class="primary" onclick="r()">Reload</button>
                <button onclick="dismissFrameNotice()">Dismiss</button>
            </div>
        </div>
    </div>

    <script defer>
        newTab()

        // The toolbar search box on this page was never connected to the browser,
        // so typing in it did nothing at all. Enter now searches or navigates the
        // same way the home page's boxes do.
        const browserSearch = document.getElementById("searchbar")

        if (browserSearch) {
            browserSearch.addEventListener("keydown", (e) => {
                if (e.key !== "Enter") return

                const value = browserSearch.value.trim()
                if (!value) return

                e.preventDefault()
                nav(value)
                browserSearch.blur()
            })
        }
    </script>
    <div id="cursor-thank-you-zxs"
        style="position: fixed; top: 0px; left: 0px; width: 16px; height: 16px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 70%, white 30%); pointer-events: none; z-index: 9999; transform: translate(748px, 592px); transition: width 0.15s, height 0.15s, opacity 0.15s; mix-blend-mode: difference; opacity: 0;">
    </div>
    <script src="/assets/js/t.js"></script>
    <script src="/assets/js/cursor.js"></script>
    <script src="/assets/js/settings.js"></script>
    <script src="/assets/js/dropdown.js"></script>
    </body>
</html>
