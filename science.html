            // Never leave an overlay (or its click-catching blur backdrop) sitting on
            // top of the page we are navigating to.
            if (typeof closeOverlays === &quot;function&quot;) closeOverlays()

            const nav = document.querySelector(&quot;nav&quot;)
            const overlayOn = localStorage.getItem(&quot;kermit_useOverlay&quot;) ?? &quot;yes&quot;
            // A store page can run full screen: the bar fades out and the page
            // takes the whole window back, so the game is not left with an empty
            // strip where the toolbar was (see collapseToolbarSpace in
            // assets/js/toolbar.js).
            const hideBar = l.includes(&quot;/stores/&quot;) &amp;&amp; overlayOn === &quot;yes&quot;

            if (l.includes(&quot;home&quot;)) {
                contentFrame.remove();
                // Clear the inline display instead of writing &quot;block&quot;: the
                // toolbar is a flex bar, and the inline block left its buttons
                // stuck to the left edge instead of centred.
                nav.style.removeProperty(&quot;display&quot;)
                setTimeout(() =&gt; {
                    nav.style.opacity = &quot;1&quot;
                }, 3)
                homeContent.style.display = &quot;block&quot;;
                document.querySelector(&quot;#gohomeblock&quot;).style.display = &quot;none&quot;
            } else {
                if (!document.body.contains(contentFrame)) {
                    document.body.appendChild(contentFrame);
                }
                if (hideBar) {
                    nav.style.opacity = 0
                    setTimeout(() =&gt; {
                        nav.style.display = &quot;none&quot;

                } else {

                }
                homeContent.style.display = &quot;none&quot;;
                contentFrame.style.display = &quot;block&quot;;
                contentFrame.src = l.includes(&quot;/stores/&quot;) ? `/pages/${l}` : `/pages/${l}.html`;

            if (window.collapseToolbarSpace) window.collapseToolbarSpace(hideBar)
        }
